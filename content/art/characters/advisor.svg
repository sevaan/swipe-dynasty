  <path fill="#1d2433" d="M104 158h36l-2 14c-1 7-6 11-13 11h-8c-7 0-12-4-13-11zM148 158h36l-2 14c-1 7-6 11-13 11h-8c-7 0-12-4-13-11z"/>
  <rect x="138" y="160" width="12" height="4" fill="#1d2433"/>
  <path d="M110 162h10l-6 12h-4zM154 162h10l-6 12h-4z" fill="#6fb2e8" opacity=".85"/>
