  <circle cx="144" cy="258" r="7" fill="#c9962a"/><path d="M106 256h76" stroke="#c9962a" stroke-width="3" opacity="0"/>
  <path fill="#000" opacity=".14" d="M214 262c36 8 60 30 60 58v40h-80z"/>
  <!-- face (the hood hides the ears) -->
  <clipPath id="face"><path d="M98 142c0-30 20-42 46-42s46 12 46 42v30c0 34-20 52-46 52s-46-18-46-52z"/></clipPath>
  <path fill="#f0c9a0" d="M98 142c0-30 20-42 46-42s46 12 46 42v30c0 34-20 52-46 52s-46-18-46-52z"/>
  <path clip-path="url(#face)" d="M168 96h30v134h-44z" fill="#dba882"/>
