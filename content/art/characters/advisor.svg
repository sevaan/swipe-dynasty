  <path d="M92 224c-8-62 10-118 52-120 42 2 60 58 52 120" fill="none" stroke="#5d6857" stroke-width="12" stroke-linecap="round"/>
  <path d="M144 104c42 2 60 58 52 120" fill="none" stroke="#444c3f" stroke-width="12" stroke-linecap="round"/>
