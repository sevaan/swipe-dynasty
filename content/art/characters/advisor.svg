  <path fill="#000" opacity=".16" d="M176 104c40 22 52 92 44 160h-32z"/>
  <path fill="#262b22" d="M94 222c-6-60 10-112 50-114 40 2 56 54 50 114z"/>
  <!-- neck -->
  <rect x="122" y="196" width="44" height="84" fill="#f0c9a0"/>
  <path d="M122 196h44v22c-14 6-30 6-44 0z" fill="#dba882"/>
  <path d="M150 218h16v62h-16z" fill="#dba882"/>
  <!-- a modern shirt under a borrowed cloak -->
  <path fill="#bcd3e6" d="M96 260h96l10 100H86z"/>
  <path fill="#a6c0d6" d="M150 262h42l10 98h-52z"/>
  <path fill="#f4f7fa" d="M112 258l32 30 32-30-6-6-26 22-26-22z"/>
  <g fill="#6f8fb0"><circle cx="144" cy="300" r="3.5"/><circle cx="144" cy="322" r="3.5"/><circle cx="144" cy="344" r="3.5"/></g>
