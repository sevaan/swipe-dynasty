<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <!-- Simulation workbench (route S): a physical bench with a large window-like panel behind it, onto a soft, living landscape; the object sits on the bench at y = 196 -->
  <!-- the backdrop bleeds 80 units past the frame on every side (x -80 to 400, y -80 to 320): the card can be from about 2:1 to square -->
  <!-- the room: a plain wall -->
  <rect x="-80" y="-80" width="480" height="280" fill="#2a2748"/>
  <g fill="#24213f"><rect x="-80" y="-80" width="480" height="30"/><rect x="-62" y="-50" width="4" height="250"/><rect x="378" y="-50" width="4" height="250"/></g>
  <!-- a large window-like panel, onto a soft, living landscape -->
  <rect x="6" y="-34" width="308" height="226" rx="16" fill="#1c1a33"/>
  <clipPath id="sm-view"><rect x="14" y="-26" width="292" height="210" rx="10"/></clipPath>
  <g clip-path="url(#sm-view)">
    <!-- dusk sky, in flat bands -->
    <rect x="14" y="-26" width="292" height="210" fill="#343566"/>
    <rect x="14" y="0" width="292" height="210" fill="#393b6e"/>
    <rect x="14" y="26" width="292" height="210" fill="#3f4376"/>
    <rect x="14" y="52" width="292" height="210" fill="#464b7c"/>
    <rect x="14" y="78" width="292" height="210" fill="#4d527f"/>
    <circle cx="232" cy="46" r="15" fill="#c9d8ff" opacity=".55"/><circle cx="232" cy="46" r="26" fill="#c9d8ff" opacity=".08"/>
    <g fill="#5a5f8e"><ellipse cx="80" cy="30" rx="30" ry="7"/><ellipse cx="100" cy="24" rx="18" ry="7"/><ellipse cx="190" cy="10" rx="26" ry="6"/><ellipse cx="274" cy="80" rx="22" ry="5"/></g>
    <!-- far hills, nearer hills, and a river winding through -->
    <path fill="#3d4f78" d="M14 118C40 104 70 96 100 102S160 116 190 106 250 90 306 104V184H14Z"/>
    <path fill="#33566e" d="M14 138C44 128 80 120 116 130S180 142 214 132 270 122 306 130V184H14Z"/>
    <path fill="#8fb4ff" opacity=".42" d="M88 122C96 128 88 136 70 142S38 158 36 184H56C58 168 72 158 88 150S104 132 98 122Z"/>
    <path fill="#2c5a63" d="M14 158C50 150 84 148 112 156S170 170 212 160 268 150 306 156V184H14Z"/>
    <!-- trees, in soft rounded clumps -->
    <rect x="38.8" y="132" width="2.4" height="10" fill="#24424c"/><ellipse cx="40" cy="128" rx="8" ry="10" fill="#2f6168"/><path fill="#285259" d="M40 118a8 10 0 0 1 0 20z"/>
    <rect x="55" y="136" width="1.9" height="8" fill="#24424c"/><ellipse cx="56" cy="132.8" rx="6.4" ry="8" fill="#2f6168"/><path fill="#285259" d="M56 124.8a6.4 8 0 0 1 0 16z"/>
    <rect x="252.7" y="124" width="2.6" height="11" fill="#24424c"/><ellipse cx="254" cy="119.6" rx="8.8" ry="11" fill="#2f6168"/><path fill="#285259" d="M254 108.6a8.8 11 0 0 1 0 22z"/>
    <rect x="271" y="128" width="2" height="8.5" fill="#24424c"/><ellipse cx="272" cy="124.6" rx="6.8" ry="8.5" fill="#2f6168"/><path fill="#285259" d="M272 116.1a6.8 8.5 0 0 1 0 17z"/>
    <rect x="289.2" y="126" width="1.7" height="7" fill="#24424c"/><ellipse cx="290" cy="123.2" rx="5.6" ry="7" fill="#2f6168"/><path fill="#285259" d="M290 116.2a5.6 7 0 0 1 0 14z"/>
    <rect x="189.3" y="118" width="1.4" height="6" fill="#24424c"/><ellipse cx="190" cy="115.6" rx="4.8" ry="6" fill="#2f6168"/><path fill="#285259" d="M190 109.6a4.8 6 0 0 1 0 12z"/>
    <g fill="#8fb4ff" opacity=".5"><path d="M120 60l5 3 5-3-5 1.4z M140 52l4 2.4 4-2.4-4 1.1z"/></g>
  </g>
  <rect x="6" y="-34" width="308" height="6" rx="3" fill="#3a3762" opacity=".6"/>
  <!-- on the wall beside the panel: a plain switch plate and a cable -->
  <rect x="-44" y="92" width="18" height="28" rx="3" fill="#35325a"/><rect x="-38" y="100" width="6" height="12" rx="2" fill="#8fb4ff" opacity=".6"/>
  <path fill="#1c1a33" d="M334-80C333.3-56.7 332.7 33.4 334 60.1C335.3 86.8 340.7 56.8 342 80.1C343.3 103.4 341.3 180 342 200C342.7 220 345.3 220 346 200C346.7 180 347.3 103.2 346 79.9C344.7 56.5 339.3 86.5 338 59.9C336.7 33.3 338.7-56.7 338-80C337.3-103.3 334.7-103.3 334-80Z"/>
  <!-- the bench: its top edge is the bench line, y = 196 -->
  <rect x="-80" y="196" width="480" height="68" fill="#4d4540"/>
  <rect x="-80" y="196" width="480" height="3.5" fill="#857868"/>
  <rect x="-80" y="226" width="480" height="2.2" fill="#3e3733"/>
  <g fill="#5b524b"><path d="M30 208h36v2H30zM210 240h44v2h-44zM-50 236h26v2h-26zM320 210h30v2h-30z"/></g>
  <!-- below the frame: the shadowed underside of the bench, then the floor -->
  <rect x="-80" y="262" width="480" height="58" fill="#15132a"/>
  <rect x="-80" y="277" width="480" height="43" fill="#1a1830"/>
  <rect x="-80" y="262" width="480" height="4" fill="#100e20"/>
</svg>
