  <path fill="#6b5b4e" d="M238 197c4-3 14-3 22-2 16 0 36 0 44 2-10 2-54 3-66 0z"/>
  <clipPath id="sb-clay"><path d="M246 196C242 186 249 176 261 172C268 164 285 164 293 173C301 179 303 188 300 196Z"/></clipPath>
