  <path fill="#352619" d="M52 46 60 70 58 100 72 128 64 162 76 196H64L54 162 60 130 48 100 50 70Z"/>
  <path fill="#3f2d22" d="M-80 132-58 126-46 158-54 196H-80Z"/>
