<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <!-- Workshop workbench (C05-C08): a plank wall with written instructions pinned up, a rack of metal tools, and a timber bench; the object sits on the bench at y = 196 -->
  <!-- the backdrop bleeds 80 units past the frame on every side (x -80 to 400, y -80 to 320): the card can be from about 2:1 to square -->
  <!-- the wall: upright boards, dark and plain in the middle -->
  <rect x="-80" y="-80" width="480" height="280" fill="#3a2f25"/>
  <rect x="-80" y="-80" width="32.4" height="280" fill="#372c23"/><rect x="-46" y="-80" width="32.4" height="280" fill="#3e3228"/><rect x="-12" y="-80" width="32.4" height="280" fill="#372c23"/><rect x="22" y="-80" width="32.4" height="280" fill="#3e3228"/><rect x="56" y="-80" width="32.4" height="280" fill="#372c23"/><rect x="90" y="-80" width="32.4" height="280" fill="#3e3228"/><rect x="124" y="-80" width="32.4" height="280" fill="#372c23"/><rect x="158" y="-80" width="32.4" height="280" fill="#3e3228"/><rect x="192" y="-80" width="32.4" height="280" fill="#372c23"/><rect x="226" y="-80" width="32.4" height="280" fill="#3e3228"/><rect x="260" y="-80" width="32.4" height="280" fill="#372c23"/><rect x="294" y="-80" width="32.4" height="280" fill="#3e3228"/><rect x="328" y="-80" width="32.4" height="280" fill="#372c23"/><rect x="362" y="-80" width="32.4" height="280" fill="#3e3228"/><rect x="396" y="-80" width="32.4" height="280" fill="#372c23"/>
  <g fill="#2a221b"><ellipse cx="-38" cy="40" rx="3" ry="4.5"/><ellipse cx="97" cy="-30" rx="2.6" ry="4"/><ellipse cx="236" cy="150" rx="2.8" ry="4.4"/><ellipse cx="372" cy="12" rx="3" ry="4.6"/><ellipse cx="170" cy="92" rx="2.2" ry="3.4"/></g>
  <!-- a crossbeam up top -->
  <rect x="-80" y="-44" width="480" height="20" fill="#30271f"/><rect x="-80" y="-28" width="480" height="4" fill="#261f19"/>
  <!-- papers pinned to the boards on the left: written instructions and a drawing -->
  <g transform="rotate(-4 -35 44)">
    <rect x="-58" y="44" width="46" height="60" fill="#d7cbb0"/>
    <path fill="#bfb193" d="M-29.48 44H-12V104H-25.800000000000004Z"/>
    <g fill="#8c7e66"><rect x="-53" y="53" width="36" height="2.2" rx="1.1"/><rect x="-53" y="60" width="30" height="2.2" rx="1.1"/><rect x="-53" y="67" width="24" height="2.2" rx="1.1"/><rect x="-53" y="74" width="36" height="2.2" rx="1.1"/><rect x="-53" y="81" width="30" height="2.2" rx="1.1"/><rect x="-53" y="88" width="24" height="2.2" rx="1.1"/><rect x="-53" y="95" width="36" height="2.2" rx="1.1"/></g>
    <circle cx="-35" cy="48" r="2.4" fill="#d9a441"/>
  </g>
  <g transform="rotate(3 28 30)">
    <rect x="6" y="30" width="44" height="58" fill="#d7cbb0"/>
    <path fill="#bfb193" d="M33.28 30H50V88H36.8Z"/>
    <g fill="#8c7e66"><rect x="11" y="39" width="34" height="2.2" rx="1.1"/><rect x="11" y="46" width="28" height="2.2" rx="1.1"/><rect x="11" y="53" width="22" height="2.2" rx="1.1"/></g>
