    <circle cx="28" cy="34" r="2.4" fill="#d9a441"/>
  </g>
  <g transform="rotate(-3 27 100)">
    <rect x="8" y="100" width="38" height="34" fill="#d7cbb0"/>
    <path fill="#bfb193" d="M31.56 100H46V134H34.599999999999994Z"/>
    <g fill="#8c7e66"><rect x="13" y="109" width="28" height="2.2" rx="1.1"/><rect x="13" y="116" width="22" height="2.2" rx="1.1"/><rect x="13" y="123" width="16" height="2.2" rx="1.1"/></g>
    <circle cx="27" cy="104" r="2.4" fill="#d9a441"/>
  </g>
