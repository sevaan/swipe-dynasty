<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- the ox from the cards, wearing a rope halter -->
  <!-- horns -->
  <path fill="#efe2c2" d="M24 13C17 14 9 12 5 4c0 8 6 15 17 16z"/>
  <path fill="#d6c9ab" d="M40 13c7 1 15-1 19-9 0 8-6 15-17 16z"/>
  <!-- ears, pink inside -->
  <ellipse cx="13" cy="26" rx="8.5" ry="4.5" transform="rotate(-18 13 26)" fill="#8a5a36"/>
  <ellipse cx="51" cy="26" rx="8.5" ry="4.5" transform="rotate(18 51 26)" fill="#6d4428"/>
  <ellipse cx="13.5" cy="26" rx="5" ry="2.2" transform="rotate(-18 13.5 26)" fill="#e98f8f"/>
  <ellipse cx="50.5" cy="26" rx="5" ry="2.2" transform="rotate(18 50.5 26)" fill="#d9807f"/>
  <!-- head and muzzle, shaded on the right -->
  <clipPath id="ox-head"><path d="M19 22c0-10 6-13 13-13s13 3 13 13c0 8-2 14-3 18H22c-1-4-3-10-3-18z"/><rect x="18" y="37" width="28" height="21" rx="10"/></clipPath>
  <path fill="#8a5a36" d="M19 22c0-10 6-13 13-13s13 3 13 13c0 8-2 14-3 18H22c-1-4-3-10-3-18z"/>
  <rect x="18" y="37" width="28" height="21" rx="10" fill="#e7dccb"/>
  <path clip-path="url(#ox-head)" fill="#000" opacity=".12" d="M39 0h25v64H41z"/>
  <!-- forelock -->
  <path fill="#efe2c2" d="M25 14c1-5 4-7 7-4 3-3 6-1 7 4-3-2-5-1-7 2-2-3-4-4-7-2z"/>
  <!-- eyes and nostrils -->
  <ellipse cx="25" cy="27" rx="2.6" ry="3.2" fill="#24150e"/><ellipse cx="39" cy="27" rx="2.6" ry="3.2" fill="#24150e"/>
  <circle cx="25.8" cy="25.9" r=".9" fill="#efe2c2"/><circle cx="39.8" cy="25.9" r=".9" fill="#efe2c2"/>
  <ellipse cx="26" cy="49" rx="2.2" ry="3" transform="rotate(20 26 49)" fill="#6d4428"/>
  <ellipse cx="38" cy="49" rx="2.2" ry="3" transform="rotate(-20 38 49)" fill="#6d4428"/>
  <!-- rope halter -->
  <g fill="#caa06f">
    <path d="M18.5 39.5c9 2.5 18 2.5 27 0v3.5c-9 2.5-18 2.5-27 0z"/>
    <path d="M18.5 41.5l-1.5-12.5 3.2-1 1.8 13z"/><path d="M45.5 41.5l1.5-12.5-3.2-1-1.8 13z"/>
  </g>
</svg>
