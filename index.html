<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1c14">
  <meta name="description" content="Reigns, but the dynasty is the history of technology.">
  <title>Untitled Swipe Game</title>
  <link rel="icon" id="favicon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/ui/app.js"></script>
</head>
<body>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  <div class="app" id="app">
    <header class="meters" id="meters" aria-label="Meters"></header>

    <main class="stage" id="stage">
      <p class="question" id="question"></p>
      <div class="deck" id="deck">
        <div class="card card-back" aria-hidden="true"><div class="card-face"></div></div>
        <div class="card" id="card" aria-roledescription="card">
          <div class="card-face">
            <div class="answer" id="answer" aria-hidden="true"></div>
            <div class="portrait" aria-hidden="true"><img class="px" id="portrait" alt="" draggable="false"></div>
            <div class="speaker" id="speaker"></div>
          </div>
        </div>
        <img class="px hand" id="hand" alt="" aria-hidden="true" draggable="false">
      </div>
      <section class="screen" id="screen" hidden></section>
    </main>

    <footer class="bar">
      <div class="who pxc" id="who"></div>
      <button class="menu-btn pxc" id="menuBtn" type="button" aria-label="Menu: Museum, Graveyard, Family Tree, Settings"><img class="px" id="menuIcon" alt="" draggable="false"></button>
    </footer>
  </div>

  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Menu" hidden></div>
  <div class="banner pxc" id="banner" role="status" hidden></div>
  <div class="sr-only" id="live" aria-live="polite"></div>
  <noscript><p class="noscript">This game needs JavaScript.</p></noscript>
</body>
</html>
