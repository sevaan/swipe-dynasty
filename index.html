<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1c14">
  <meta name="description" content="One life. One invention. Everyone else deals with it.">
  <title>One Bright Idea</title>
  <link rel="icon" id="favicon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/ui/app.js"></script>
</head>
<body>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  <div class="app" id="app">
    <!-- 1. Context: who, when, and the problem (spec 12.1) -->
    <header class="context" id="context">
      <div class="who">
        <p class="line"><strong id="inventor"></strong><span class="sep" aria-hidden="true"> · </span><span id="era"></span></p>
        <p class="problem" id="problem"></p>
      </div>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu: history and settings"><span class="glyph" id="menuIcon" aria-hidden="true"></span></button>
    </header>

    <main class="play" id="play">
      <!-- 2. The situation, up top where it's read: what just happened, who's talking, what's happening now -->
      <section class="situation" id="situation">
        <p class="result" id="result"></p>
        <p class="notice" id="notice"></p>
        <div class="speaker" id="speaker"><span class="face" id="face"></span><span class="name" id="speakerName"></span></div>
        <p class="text" id="text"></p>
      </section>

      <!-- 3. At the bottom, under the thumb: what this inventor has found out, and the card -->
      <div class="stage" id="stage">
        <ul class="evidence" id="evidence" aria-label="What you've found out"></ul>
        <!-- The card: the object on its workbench, with the two answers along its
             foot. Tap an answer, or drag the card sideways to see that side's
             answer and let go past about a quarter of the way to choose it. -->
        <div class="card" id="card">
          <div class="bench" id="bench" aria-hidden="true">
            <img class="art layer" id="benchArt" alt="" draggable="false">
            <img class="art layer" id="objectArt" alt="" draggable="false">
            <div class="marks" id="marks"></div>
            <div class="peek" id="peek"></div>
            <img class="art hand" id="hand" alt="" draggable="false">
          </div>
          <div class="choices" id="choices">
            <button class="choice left" id="choiceLeft" type="button" data-side="left"></button>
            <button class="choice right" id="choiceRight" type="button" data-side="right"></button>
          </div>
        </div>
      </div>
    </main>

    <!-- Between lives: the exhibit, the inheritance, a new era, the end -->
    <section class="screen" id="screen" hidden></section>
  </div>

  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Menu" hidden></div>
  <div class="banner" id="banner" role="status" hidden></div>
  <div class="sr-only" id="live" aria-live="polite"></div>
  <noscript><p class="noscript">This game needs JavaScript.</p></noscript>
</body>
</html>
