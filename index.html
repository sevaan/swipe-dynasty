<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1c14">
  <meta name="description" content="Reigns, but the dynasty is the history of technology.">
  <title>Untitled Swipe Game</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/ui/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="meters" id="meters" aria-label="Meters"></header>

    <main class="stage" id="stage">
      <p class="question" id="question"></p>
      <div class="deck" id="deck">
        <div class="card card-back" aria-hidden="true"></div>
        <div class="card" id="card" aria-roledescription="card">
          <div class="answer" id="answer" aria-hidden="true"></div>
          <div class="portrait" id="portrait" aria-hidden="true"></div>
          <div class="speaker" id="speaker"></div>
        </div>
        <div class="hand" id="hand" aria-hidden="true">👆</div>
      </div>
      <section class="screen" id="screen" hidden></section>
    </main>

    <footer class="bar">
      <div class="who" id="who"></div>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu: Museum, Graveyard, Family Tree, Settings">≡</button>
    </footer>
  </div>

  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Menu" hidden></div>
  <div class="banner" id="banner" role="status" hidden></div>
  <div class="sr-only" id="live" aria-live="polite"></div>
  <noscript><p class="noscript">This game needs JavaScript.</p></noscript>
</body>
</html>
