<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1a1e">
  <meta name="description" content="One life. One invention. Someone takes it further.">
  <title>One Bright Idea</title>
  <link rel="icon" id="favicon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&family=Fraunces:opsz,wght,SOFT@9..144,500..900,0..100&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/ui/app.js"></script>
</head>
<body>
  <!-- The sky: the era's colours, darker toward the top, with firelight
       behind the deck as the idea catches, and the weather over it -->
  <div class="sky" aria-hidden="true"><div class="glow"></div></div>
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>

  <div class="app" id="app">
    <!-- Who you are this life and when, and how far through it you are -->
    <header class="top" id="top">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Your history and settings"><span class="glyph" id="menuIcon" aria-hidden="true"></span></button>
      <p class="context"><strong id="who"></strong><span class="era" id="era"></span></p>
      <ol class="pips" id="pips"></ol>
    </header>

    <!-- The deck: every moment of the game is a card dealt from it (src/ui/table.js) -->
    <main class="table" id="table">
      <div class="deck" id="deck"></div>
    </main>
  </div>

  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Menu" hidden></div>
  <div class="banner" id="banner" role="status" hidden></div>
  <p class="sr-only" id="live" aria-live="polite"></p>
  <noscript><p class="noscript">This game needs JavaScript.</p></noscript>
</body>
</html>
