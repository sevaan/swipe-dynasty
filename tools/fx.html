<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weather preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0c0a09; color: #f4e7cd; font: 14px/1.4 system-ui, sans-serif; }
    .phone { position: relative; width: min(390px, 100vw); height: min(844px, 100vh); margin: 0 auto; overflow: hidden; background: var(--sky, #2a1c14); }
    .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .stage { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 22px; }
    .question { margin: 0 0 18px; font-size: 20.8px; font-weight: 500; line-height: 1.34; text-align: center; text-wrap: balance; }
    .card { flex: none; width: 288px; height: 360px; border-radius: 18px; background: #6f9a8d; box-shadow: 0 7px 0 rgb(0 0 0 / 30%); }
    .pick { position: absolute; top: 10px; left: 10px; font: inherit; color: inherit; background: rgb(0 0 0 / 50%); border: 0; border-radius: 8px; padding: 6px 8px; }
    .shake { animation: shake 480ms ease-out; }
    @keyframes shake {
      20% { transform: translate(-4px, 2px); }
      40% { transform: translate(4px, -2px); }
      60% { transform: translate(-3px, -2px); }
      80% { transform: translate(3px, 2px); }
    }
  </style>
</head>
<body>
  <div class="phone">
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <div class="stage" id="stage">
      <p class="question" id="question">It's raining again. Everything we own is wet, including the fire.</p>
      <div class="card" aria-hidden="true"></div>
    </div>
    <select class="pick" id="pick" aria-label="Scene"></select>
  </div>
  <script type="module">
    // Previews the weather behind a stand-in card: ?scene=storm (a scene in
    // content/world.json, or one effect on its own, like ?scene=stars), or
    // ?fx=rain,lightning&bg=%2318222c. Add &still=1 for the reduced-motion frame.
    import { createFx, EFFECT_NAMES } from '../src/ui/fx.js';

    const params = new URLSearchParams(location.search);
    const world = await (await fetch('../content/world.json')).json();
    const skies = world.eras.flatMap((era) => era.sky || []);
    const name = params.get('scene') || (params.has('fx') ? '' : 'rain');
    // One effect on its own gets the first era sky that uses it (stars: night)
    const scene = world.scenes[name]
      || (EFFECT_NAMES.includes(name) ? { bg: skies.find((s) => s.fx?.includes(name))?.bg, fx: [name] } : {});
    const names = params.has('fx') ? params.get('fx').split(',').map((s) => s.trim()) : scene.fx || [];
    const still = params.get('still') === '1';
    document.documentElement.style.setProperty('--sky', params.get('bg') || scene.bg || skies[0]?.bg || '#2a1c14');

    const stage = document.getElementById('stage');
    const fx = createFx(document.getElementById('fx'), {
      onShake() { stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); },
    });
    fx.set(names, { reduceMotion: still });

    // Thin the weather behind the question, as the game does
    const question = document.getElementById('question');
    function quiet() {
      const range = document.createRange();
      range.selectNodeContents(question);
      const r = range.getBoundingClientRect();
      fx.setQuiet([{ left: r.left - 12, top: r.top - 8, right: r.right + 12, bottom: r.bottom + 8 }]);
    }
    quiet();
    document.fonts?.ready.then(quiet);
    window.addEventListener('resize', quiet);

    const pick = document.getElementById('pick');
    const option = (value) => `<option${value === name ? ' selected' : ''}>${value}</option>`;
    pick.innerHTML = `<optgroup label="Scenes">${Object.keys(world.scenes).map(option).join('')}</optgroup>`
      + `<optgroup label="One effect">${EFFECT_NAMES.filter((n) => !world.scenes[n]).map(option).join('')}</optgroup>`;
    if (!world.scenes[name] && !EFFECT_NAMES.includes(name)) pick.insertAdjacentHTML('afterbegin', '<option selected>(custom)</option>');
    pick.addEventListener('change', () => { location.search = `?scene=${pick.value}${still ? '&still=1' : ''}`; });
  </script>
</body>
</html>
