<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weather preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0c0a09; color: #f4e7cd; font: 14px/1.4 system-ui, sans-serif; }
    .phone { position: relative; width: min(390px, 100vw); height: min(844px, 100vh); margin: 0 auto; overflow: hidden; background: var(--sky, #2a1c14); }
    .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .stage { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 0 16px; }
    .bench { width: 100%; aspect-ratio: 1; border-radius: 18px; background: #3b2a1e; box-shadow: 0 6px 0 rgb(0 0 0 / 30%); }
    .text { margin: 0; font-size: 19.2px; font-weight: 500; line-height: 1.38; }
    .pick { position: absolute; top: 10px; left: 10px; font: inherit; color: inherit; background: rgb(0 0 0 / 50%); border: 0; border-radius: 8px; padding: 6px 8px; }
    .shake { animation: shake 480ms ease-out; }
    @keyframes shake {
      20% { transform: translate(-4px, 2px); }
      40% { transform: translate(4px, -2px); }
      60% { transform: translate(-3px, -2px); }
      80% { transform: translate(3px, 2px); }
    }
  </style>
</head>
<body>
  <div class="phone">
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <div class="stage" id="stage">
      <div class="bench" aria-hidden="true"></div>
      <p class="text" id="text">It dried hard in the sun. Then it rained, and the dried vessel became mud again. The Naysayer says this is what mud is for.</p>
    </div>
    <select class="pick" id="pick" aria-label="Weather"></select>
  </div>
  <script type="module">
    // Previews the weather behind a stand-in workbench: ?weather=storm (a
    // weather in content/world.json, or one effect on its own, like
    // ?weather=stars), or ?fx=rain,lightning&bg=%2318222c. Add &still=1 for
    // the reduced-motion frame. (?scene= still works, for old links.)
    import { createFx, EFFECT_NAMES } from '../src/ui/fx.js';

    const params = new URLSearchParams(location.search);
    const world = await (await fetch('../content/world.json')).json();
    const weather = world.weather || {};
    const skies = world.eras.flatMap((era) => era.sky || []);
    const name = params.get('weather') || params.get('scene') || (params.has('fx') ? '' : 'rain');
    // One effect on its own gets the first era sky that uses it (stars: night)
    const chosen = weather[name]
      || (EFFECT_NAMES.includes(name) ? { bg: skies.find((s) => s.fx?.includes(name))?.bg, fx: [name] } : {});
    const names = params.has('fx') ? params.get('fx').split(',').map((s) => s.trim()) : chosen.fx || [];
    const still = params.get('still') === '1';
    document.documentElement.style.setProperty('--sky', params.get('bg') || chosen.bg || skies[0]?.bg || '#2a1c14');

    const stage = document.getElementById('stage');
    const fx = createFx(document.getElementById('fx'), {
      onShake() { stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); },
    });
    fx.set(names, { reduceMotion: still });

    // Thin the weather behind the words, as the game does
    const text = document.getElementById('text');
    function quiet() {
      const r = text.getBoundingClientRect();
      fx.setQuiet([{ left: r.left - 8, top: r.top - 6, right: r.right + 8, bottom: r.bottom + 6 }]);
    }
    quiet();
    document.fonts?.ready.then(quiet);
    window.addEventListener('resize', quiet);

    const pick = document.getElementById('pick');
    const option = (value) => `<option${value === name ? ' selected' : ''}>${value}</option>`;
    pick.innerHTML = `<optgroup label="Weather">${Object.keys(weather).map(option).join('')}</optgroup>`
      + `<optgroup label="One effect">${EFFECT_NAMES.filter((n) => !weather[n]).map(option).join('')}</optgroup>`;
    if (!weather[name] && !EFFECT_NAMES.includes(name)) pick.insertAdjacentHTML('afterbegin', '<option selected>(custom)</option>');
    pick.addEventListener('change', () => { location.search = `?weather=${pick.value}${still ? '&still=1' : ''}`; });
  </script>
</body>
</html>
