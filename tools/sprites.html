<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprite gallery</title>
  <style>
    body { margin: 0; padding: 16px; background: #2a1c14; color: #f4e7cd; font: 14px/1.4 system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin: 22px 0 8px; }
    .grid { display: flex; flex-wrap: wrap; gap: 12px; }
    figure { margin: 0; display: grid; justify-items: center; gap: 6px; }
    .tile { display: flex; gap: 6px; }
    .tile > div { padding: 8px; display: grid; place-items: center; }
    .on-card { background: #ecd9b4; }
    .on-dark { background: #3b2a1e; }
    .ghost { opacity: .25; }
    figcaption { font: 12px ui-monospace, Menlo, monospace; opacity: .8; }
    img { image-rendering: pixelated; }
    .errors { white-space: pre-wrap; font: 12px ui-monospace, Menlo, monospace; color: #ffb4a8; }
  </style>
</head>
<body>
  <h1>Sprite gallery</h1>
  <p>Every sprite in <code>content/sprites/</code>, on the card colour, on the dark background, and as a silhouette.</p>
  <div id="out"></div>
  <script type="module">
    import { loadContentWeb } from '../src/content/load-web.js';
    import { spriteHTML } from '../src/ui/sprites.js';
    const out = document.getElementById('out');
    const { content, errors } = await loadContentWeb('../content/');
    if (errors.length) out.innerHTML = `<div class="errors">${errors.map((e) => `${e.file}:${e.line} ${e.message}`).join('\n')}</div>`;
    const byFile = {};
    for (const s of Object.values(content.sprites)) (byFile[s.src.file] ||= []).push(s);
    for (const [file, list] of Object.entries(byFile)) {
      out.insertAdjacentHTML('beforeend', `<h2>${file}</h2><div class="grid">${list.map((s) => {
        const scale = s.w >= 24 ? 5 : s.w >= 16 ? 4 : 5;
        return `<figure><div class="tile">
          <div class="on-card">${spriteHTML(content, s.id, { scale })}</div>
          <div class="on-dark">${spriteHTML(content, s.id, { scale })}</div>
          <div class="on-dark">${spriteHTML(content, s.id, { scale, mode: 'ghost', cls: 'ghost' })}</div>
        </div><figcaption>${s.id} ${s.w}×${s.h}</figcaption></figure>`;
      }).join('')}</div>`);
    }
  </script>
</body>
</html>
