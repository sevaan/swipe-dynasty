<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1c14">
  <title>The script</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&display=swap">
  <style>
    :root {
      --bg: #2a1c14; --panel: #3b2a1e; --panel-2: #33241a; --card: #ecd9b4; --ink: #2a1c14;
      --text: #f4e7cd; --muted: #dccdb0; --accent: #e8793a; --line: #4a3727;
      --font: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; scroll-padding-top: 64px; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); -webkit-text-size-adjust: 100%; }
    main { max-width: 760px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 48px); }
    h1 { font-size: 1.7rem; line-height: 1.15; margin: 0 0 6px; }
    h2 { font-size: 1.3rem; line-height: 1.2; margin: 44px 0 4px; }
    p { margin: 0; }
    a { color: var(--text); text-decoration-thickness: 2px; text-underline-offset: 3px; }
    code { font: 0.9em ui-monospace, Menlo, monospace; }
    .lede { color: var(--muted); max-width: 36em; }
    .bar { position: sticky; top: 0; z-index: 5; margin: 14px -16px 0; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 94%, transparent); display: flex; flex-wrap: wrap; gap: 6px; }
    .bar button, .btn { min-height: 38px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--panel); color: var(--text); font: 800 0.86rem var(--font); cursor: pointer; }
    .bar button[aria-pressed="true"] { background: var(--accent); color: var(--ink); }
    .btn.primary { background: var(--accent); color: var(--ink); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
    .meta { color: var(--muted); margin: 2px 0 0; }
    .box { margin: 10px 0; padding: 12px 16px; border-radius: 14px; background: var(--panel); }
    .box p + p { margin-top: 6px; }
    .box .kicker { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .box b { color: var(--text); }
    .arrival { font-size: 1.02rem; }
    .want { font-weight: 700; }
    .scene { margin: 12px 0; padding: 14px 16px 16px; border-radius: 16px; background: var(--panel); scroll-margin-top: 64px; }
    .scene:target { outline: 3px solid var(--accent); }
    .who { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
    .who .name { font-weight: 800; }
    .who .desc { font-size: 0.86rem; color: var(--muted); }
    .who .id { margin-left: auto; font: 0.75rem ui-monospace, Menlo, monospace; color: var(--muted); white-space: nowrap; }
    .text { margin: 10px 0 4px; font-size: 1.1rem; line-height: 1.42; }
    .answers { display: grid; gap: 10px; margin-top: 12px; }
    @media (min-width: 620px) { .answers { grid-template-columns: 1fr 1fr; } }
    .answer { padding: 12px 14px; border-radius: 12px; background: var(--panel-2); }
    .answer .side { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .answer .label { margin-top: 2px; font-size: 1.02rem; font-weight: 800; line-height: 1.3; }
    .answer .result { margin-top: 6px; }
    .answer .fx { margin-top: 6px; font-size: 0.86rem; color: var(--muted); }
    .answer .fx.some { color: #ffc9a8; }
    .cb { margin-top: 8px; padding: 6px 10px; border-left: 3px solid var(--accent); font-size: 0.92rem; }
    .cb .if { font-size: 0.8rem; font-weight: 800; color: var(--muted); display: block; }
    .placard { margin-top: 8px; padding: 10px 14px; border-radius: 12px; background: var(--card); color: var(--ink); }
    .placard p + p { margin-top: 4px; }
    .placard b { color: var(--ink); }
    .errors { white-space: pre-wrap; font: 0.8rem ui-monospace, Menlo, monospace; color: #ffb4a8; }
    .fine { color: var(--muted); font-size: 0.85rem; margin-top: 40px; }
  </style>
</head>
<body>
  <main id="out"><p>Loading the script…</p></main>
  <script type="module">
    // The game's script for review, straight from content/script.md as the
    // game reads it: every life in play order with both results, exact
    // effects, callbacks, closing records, proposals and endings. The
    // arrangement comes from script-text.js, which also makes the Markdown.
    import { loadContentWeb } from '../src/content/load-web.js';
    import { scriptText } from './script-text.js';

    const out = document.getElementById('out');
    const { content, errors } = await loadContentWeb('../content/');
    if (errors.length) {
      out.innerHTML = `<h1>The script</h1><div class="errors">The content has errors:\n\n${errors.map((e) => `${e.file}:${e.line} ${e.column ? `[${e.column}] ` : ''}${e.message}`).join('\n')}</div>`;
      throw new Error('content errors');
    }
    const C = content.campaign;
    const T = scriptText(content);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const link = (id) => `<a href="#${esc(id)}">${esc(id)}</a>`;
    const params = new URLSearchParams(location.search);
    let filter = params.get('filter') || 'all';

    function cardHTML(c, card) {
      const who = c.cast[card.speaker];
      const answer = (side) => {
        const o = card[side];
        const fx = T.effectWords(o);
        return `<div class="answer"><p class="side">${side}</p><p class="label">${esc(o.label)}</p>
          <p class="result">${esc(o.result)}</p><p class="fx${fx === 'no effects' ? '' : ' some'}">${esc(fx)}</p></div>`;
      };
      const after = T.callbacksAfter(card.id).map((cb) => `<p class="cb"><span class="if">Callback ${cb.n}, if ${link(cb.card)} was ${esc(cb.side)}</span>${esc(cb.text)}</p>`).join('');
      const from = T.callbacksFrom(card.id).map((cb) => `<p class="cb"><span class="if">Sets up callback ${cb.n}: shown after ${link(cb.after)} if this was ${esc(cb.side)}</span></p>`).join('');
      return `<article class="scene" id="${esc(card.id)}">
        <div class="who"><span class="name">${esc(who?.name || card.speaker)}</span><span class="desc">${esc(who?.description || '')}</span><span class="id">${esc(card.id)} · ${esc(card.kind)}</span></div>
        <p class="text">${esc(card.text)}</p>
        <div class="answers">${answer('left')}${answer('right')}</div>
        ${after}${from}
      </article>`;
    }

    function chapterHTML(id) {
      const c = C.chapters[id];
      const route = c.route ? C.routes[c.route] : null;
      const o = C.overrides[id];
      let h = `<h2 id="${esc(id)}">${esc(id)} — ${esc(c.title)}</h2>
        <p class="meta">${esc(c.era)}${c.prerequisite ? ` · needs ${esc(C.inventions[c.prerequisite]?.name || c.prerequisite)}` : ''}</p>`;
      if (route && route.chapters[0] === id) h += `<div class="box"><p class="kicker">Proposal</p><p><b>${esc(route.title)}</b> ${esc(route.pitch)}</p><p class="meta">Accept: "${esc(route.acceptLabel)}"</p></div>`;
      h += `<div class="box"><p><b>${esc(c.inventor.name)}</b>, ${esc(c.inventor.role)}</p><p class="arrival">${esc(c.arrival)}</p><p class="want">You want: ${esc(c.inventor.want)}</p>
        ${o ? `<p class="meta">After ${esc(o.when.card)} = ${esc(o.when.side)}: "${esc(o.arrival)}" (era: ${esc(o.era)})</p>` : ''}
        <p class="meta">Invention on card four: <b>${esc(c.invention.name)}</b>. ${esc(c.invention.description)}</p>
        <p class="meta">Cast: ${c.castOrder.map((k) => `${esc(c.cast[k].name)} (${esc(c.cast[k].description)})`).join('; ')}</p>
        <p class="meta">Workbench: ${c.bench.map((b, i) => `${i + 1}. ${esc(b)}`).join(' ')}</p></div>`;
      h += c.cards.map((card) => cardHTML(c, card)).join('');
      h += `<div class="box"><p class="kicker">Closing record</p>
        <div class="placard"><p><b>Card six left:</b> ${esc(c.legacy.left)}</p><p><b>Card six right:</b> ${esc(c.legacy.right)}</p>
        ${c.final ? '<p><b>Final life:</b> no obituary; the ending follows.</p>' : `<p><b>Obituary:</b> ${esc(c.death.natural)}</p>${c.death.risk ? `<p><b>With exposure 2 or more:</b> ${esc(c.death.risk)}</p>` : ''}`}</div></div>`;
      if (C.redirect?.after === id) {
        const r = C.redirect;
        h += `<article class="scene" id="${esc(r.id)}"><div class="who"><span class="name">The Archive</span><span class="id">${esc(r.id)}</span></div><p class="text">${esc(r.text)}</p>
          <div class="answers">${['left', 'right'].map((side) => `<div class="answer"><p class="side">${side}</p><p class="label">${esc(r[side].label)}</p><p class="result">${esc(r[side].result)}</p><p class="fx some">goes to ${link(r[side].transition)}</p></div>`).join('')}</div></article>`;
      }
      if (route && c.final) {
        const e = route.ending;
        h += `<div class="box"><p class="kicker">Ending — ${esc(e.title)}</p>${e.panels.map((p, i) => `<p>${i + 1}. ${esc(p)}</p>`).join('')}
          <p class="meta">If ${link(e.card)} was left: ${esc(e.variants.left)}</p><p class="meta">If ${link(e.card)} was right: ${esc(e.variants.right)}</p></div>`;
      }
      return h;
    }

    function draw() {
      const ids = T.chaptersFor(filter);
      out.innerHTML = `
        <h1>One Bright Idea: the script</h1>
        <p class="lede">Read live from <code>content/script.md</code>, the file the game plays, so it's always current. Story ids appear here, never in the game. Experimental exposure is hidden in the game and picks the obituary; it's shown here for the writers.</p>
        <div class="actions"><button class="btn primary" type="button" id="md">Download as Markdown</button><a class="btn" href="../" style="display:inline-grid;place-items:center;text-decoration:none">Play the game</a></div>
        <nav class="bar" aria-label="Show">${T.filters().map(([id, name]) => `<button type="button" data-filter="${esc(id)}" aria-pressed="${id === filter}">${esc(name)}</button>`).join('')}</nav>
        <p class="meta" style="margin-top:8px">${ids.length} lives: ${ids.map(link).join(' ')}</p>
        ${ids.map(chapterHTML).join('')}
        <p class="fine">Script ${esc(C.hash)} · ${C.chapterOrder.length} lives, ${Object.keys(C.cards).length} cards, ${C.callbacks.length} callbacks.</p>`;
      document.getElementById('md').addEventListener('click', () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([T.markdown(filter)], { type: 'text/markdown' }));
        a.download = `one-bright-idea-script${filter === 'all' ? '' : `-${filter}`}.md`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      });
    }
    out.addEventListener('click', (e) => {
      const b = e.target.closest('[data-filter]');
      if (!b) return;
      filter = b.dataset.filter;
      history.replaceState(null, '', `?filter=${filter}`);
      draw();
    });
    draw();
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
  </script>
</body>
</html>
