<!doctype html>
<!--
  CINEMA: a design note

  The idea
    The life plays like a short film. The workbench is the screen: one shot
    filling the top of the phone edge to edge (about 55-60% of its height),
    drifting slowly like a camera on a slider and fading into the dark at its
    foot. The words sit below it like subtitles, always with who is speaking.
    Choosing is a cut to the next shot. The arrival is the opening title over
    a wide establishing shot, the invention is a title card over a close hero
    shot, and the end of the life is the end credits over black. Warm, never
    gloomy: the cave is cold and dim until there's fire, and from then on
    the fire lights it, so the picture warms up as the life goes on ("A
    Little Warmth"). The credits keep a few embers rising over a low glow.

  Type scale
    Reading, Atkinson Hyperlegible Next: subtitles 20/1.42 (medium);
    arrival text, descriptions and credits 18/1.45; answers 18/1.28
    (semibold); the chosen answer above a result 16/1.3 (bold, ember); the
    helper 15/1.35; the speaker's name and small caps labels 13-14,
    uppercase, tracked +0.14 to +0.26em.
    Titles, Fraunces (soft, optical size 144): the inventor's name 68/0.95,
    the invention's title card 42/1.05, the name in the credits 72/1.
    The frame gives up height before the words do: it's as tall as it can be
    while the longest subtitle and answer pair fit under it, so nothing moves
    from card to card. If that still won't fit a short screen, the subtitles
    drop to 19px.

  Palette
    night #0c0907 (the screen, and what the frame fades into)
    ink #f9f1e5 (the words; 17:1 on night)
    parchment #dccab0 (secondary lines; 12:1)
    ember #f4aa5c (labels, the chosen line, anything lit; 10:1)
    cream #f6ead5 with ink #1c130d (the one primary action on a screen)
    glass rgb(255 232 204 / 7%) with a 16% hairline (the two answers)
    firelight rgb(255 172 84) in a screen-blended glow (the fire, the reveal)

  Motion language: camera moves and cuts
    - Every card and result is a new shot with a slow Ken Burns drift, scale
      1.03 to 1.08 over 22s, each toward a slightly different point.
    - Choosing cuts the scene: a 320ms crossfade to the next workbench
      state, while the old shot whips a little toward the chosen side. The
      chosen button flares ember and is the last thing to leave (gone by
      270ms, before the result arrives where the answers were).
    - A result is a closer shot of what just happened: with the answers gone,
      the frame grows down the screen (440ms) to the result, which sits at
      the foot just above Continue, and the camera comes in to fill it.
      Back on a card, the frame closes up again as it cuts wider. In both
      directions the old shot travels to the new framing as it dissolves,
      so it reads as one camera move with only the scene changing.
    - Subtitles are never double-exposed: the last one clears (140ms), then
      the next arrives sentence by sentence, each fading in over 340ms, 100ms
      apart, so a card is readable in under a second. The answers rise in
      behind them; the result's "Continue" chevron fades in at 650ms.
    - Arrival: fade up from black; the era, the name (a focus pull), the
      role, the arrival and the want follow in a title-sequence stagger.
      "Begin this life" clears the title and the camera settles in (1s).
    - Reveal: the frame opens down the screen and pushes in on the flame
      (1.1s), a warm bloom rises, and the title card focuses in.
    - Epitaph: the picture fades to black (1s) as the credits start to roll
      over it, and the button is there at 1.1s, while the last lines rise.
    - Play again: the credits clear and the opening fades up from black.
    - Reduced motion: no drift, pan, whip or push; everything is a short fade.

  How the swipe works
    Swipe across the picture (or the words under it). The shot pans with the
    finger through a rubber band, with the bench behind moving about half as
    far as the object in front, so it has depth. A glass label comes up over
    the picture with the answer on that side, and that side's button starts
    to glow. Past about a quarter of the width, the label turns ember, the
    button lights fully, and the phone ticks: letting go there chooses it.
    Letting go sooner springs the shot back. Left is the upper answer, marked
    with a chevron on its left edge; right is the lower one, marked on its
    right. A press on the picture shows a chevron at each edge; a tap nudges
    the shot to show it moves. Arrow keys choose; Enter or Space continues.
    A press that began before a step appeared (or in its first moments,
    while it's arriving) is ignored, so a double tap can't skip a result.

  Technical note: the pictures come from life.picture(). Each SVG's viewBox is
  widened in memory to its full 80-unit bleed, so a "camera" can frame
  the workbench in any shape of frame without running out of drawing.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0907">
  <meta name="color-scheme" content="dark">
  <title>Cinema · One Bright Idea</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&display=swap">
  <link rel="stylesheet" href="cinema.css">
  <script type="module" src="cinema.js"></script>
</head>
<body>
  <div class="app" id="app">
    <!-- The picture: the whole screen, framed by a camera. Its fade into night
         moves with the step: the foot of the frame on a card, lower for the
         opening title and the title card, all the way to black for the credits. -->
    <div class="stage" id="stage" role="img" aria-label="">
      <div class="shots" id="shots"></div>
      <div class="bloom" id="bloom"></div>
      <div class="vignette"></div>
      <div class="fade" id="fade"></div>
      <div class="shade-top"></div>
    </div>
    <!-- Behind the credits: the last of the fire -->
    <div class="embers" id="embers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

    <!-- While a finger is on the picture: an edge chevron each side, and the
         answer being chosen in a glass label -->
    <div class="edges" id="edges" aria-hidden="true">
      <span class="edge" data-side="left"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></span>
      <span class="edge" data-side="right"><svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></span>
    </div>
    <div class="peek" id="peek" aria-hidden="true">
      <span class="peek-in">
        <svg class="peek-dir l" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        <span class="peek-text" id="peekText"></span>
        <svg class="peek-dir r" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
      </span>
    </div>
    <p class="helper" id="helper" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8.5 3.5 12 7 15.5M17 8.5l3.5 3.5-3.5 3.5M4 12h16"/></svg><span></span></p>

    <!-- The words: subtitles, the opening title, the title card, the credits -->
    <div class="words" id="words"></div>

    <!-- The two answers, under the thumb -->
    <div class="answers" id="answers">
      <button class="answer" id="answerLeft" type="button" data-side="left" aria-keyshortcuts="ArrowLeft">
        <span class="dir" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></span>
        <span class="label"></span>
      </button>
      <button class="answer" id="answerRight" type="button" data-side="right" aria-keyshortcuts="ArrowRight">
        <span class="label"></span>
        <span class="dir" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></span>
      </button>
    </div>

    <!-- After a result: tap anywhere, or this -->
    <button class="continue" id="continue" type="button" hidden>
      <span class="continue-label"></span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
    </button>

    <a class="proto" href="../"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>Prototypes</a>
    <div class="sr-only" id="live" aria-live="polite"></div>
    <div class="probe" id="probe" aria-hidden="true"></div>
  </div>
  <noscript><p class="oops">This prototype needs JavaScript.</p></noscript>
</body>
</html>
